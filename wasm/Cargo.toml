[package]
name = "celestial-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Complete browser WebAssembly interface to celestial-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
celestial-core = { path = "../core", features = ["timezone", "calendar-traditions"] }
js-sys = "=0.3.106"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.129"
